name: Security

# Static analysis + container scanning. Runs on every push to main, on PRs
# that touch code (docs-only PRs skipped), and weekly to catch CVEs
# disclosed since the last commit. Findings flow to the GitHub Security
# tab via SARIF.
#
# This job is part of the SOC 2 prerequisite checklist
# (`docs/soc2-readiness.md` § Vulnerability + dependency management).
# Removing it weakens an attestable control — coordinate with the security
# officer before disabling.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  schedule:
    # Mondays at 06:00 UTC — catches CVEs disclosed since the last commit.
    - cron: '0 6 * * 1'

permissions:
  # SARIF upload requires `security-events: write`. `actions: read` is
  # needed by the CodeQL analyze step's telemetry / workflow-run lookup
  # (without it you get "Resource not accessible by integration" which
  # fails the whole job even when the analysis itself succeeded).
  contents: read
  security-events: write
  actions: read

jobs:
  codeql-python:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          # `security-extended` is the built-in CodeQL suite name.
          # `security` alone is not a valid query pack and causes
          # "Query pack security cannot be found" at init time.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:python'

  codeql-javascript:
    name: CodeQL (TypeScript/JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  trivy-backend-image:
    name: Trivy (backend container)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ap-backend:scan ./backend

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ap-backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend
