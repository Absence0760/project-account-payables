services:
  postgres:
    # pgvector/pgvector image = official Postgres 16 + the pgvector extension,
    # used by the RAG extraction priors (see backend/docs/ai-extraction.md).
    # If you were running plain postgres:16 and have existing data, this upgrade
    # is safe — the image is binary-compatible with the same data directory.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: account_payables
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-tenants.sql:/docker-entrypoint-initdb.d/02-tenants.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Local OIDC identity provider — the dev-laptop equivalent of Okta / Entra,
  # so the SSO flow (app/api/auth_sso.py) can be exercised end-to-end with no
  # cloud account. Opt-in: it only starts under the `idp` profile, so the core
  # `docker compose up -d` (pnpm db:up) stays lean. Bring it up with
  # `pnpm idp:up`, then `pnpm idp:seed` to point the acme tenant at it.
  #
  # Runs in dev mode (start-dev) with an ephemeral in-memory database, and
  # re-imports realm-export.json on every boot — so the IdP is always a clean,
  # reproducible state. Realm `account-payables` ships a confidential client
  # (account-payables-app) and two test users (demo@acme.com, newhire@acme.com),
  # both password `demo`.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["idp"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      # Host 8088 (not 8080) to dodge collisions with other local dev tooling
      # that squats on 8080. Keycloak in dev mode derives its issuer + endpoint
      # URLs from the request Host header, so localhost:8088 yields a consistent
      # issuer with no extra hostname config.
      - "8088:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  # Local SCIM identity provider. Where Keycloak above covers inbound OIDC SSO
  # (we pull from it), Authentik covers outbound SCIM provisioning: Authentik is
  # the SCIM *client* that pushes users into our SCIM Service Provider endpoint
  # (app/api/scim.py, /api/scim/v2/Users) using a per-tenant bearer token. This
  # is the local-first equivalent of Okta/Entra SCIM, so the provisioning path
  # can be exercised with no cloud account.
  #
  # Self-contained: its own Postgres + Redis (NOT the app's), so the whole IdP
  # stack lives under the `idp` profile and `pnpm idp:up` works without the core
  # services. Authentik reaches the app's backend (run on the host, :8000) via
  # host.docker.internal — see the SCIM provider URL in the blueprint. Bring it
  # up with `pnpm idp:up`, then `pnpm scim:seed` sets the matching token on the
  # acme tenant. Full walkthrough: ../../docs/local-sso-keycloak.md § Authentik.
  authentik-postgres:
    image: postgres:16-alpine
    profiles: ["idp"]
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik
      POSTGRES_DB: authentik
    volumes:
      - authentik-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-redis:
    image: redis:7-alpine
    profiles: ["idp"]
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.2
    profiles: ["idp"]
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: local-dev-authentik-secret-key-not-for-production
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
      # Bootstrap admin (akadmin) + a fixed API token so the docs / scripts can
      # drive the API (trigger a SCIM sync) without clicking through onboarding.
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin
      AUTHENTIK_BOOTSTRAP_TOKEN: local-dev-authentik-api-token
      AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@localhost
    ports:
      # Authentik's HTTP port is 9000 inside the container — MinIO already owns
      # host 9000, so map the admin UI / API to host 9002.
      - "9002:9000"
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    extra_hosts:
      # Lets the SCIM provider reach the app backend running on the host (:8000).
      - "host.docker.internal:host-gateway"
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.2
    profiles: ["idp"]
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: local-dev-authentik-secret-key-not-for-production
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_PASSWORD: admin
      AUTHENTIK_BOOTSTRAP_TOKEN: local-dev-authentik-api-token
      AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@localhost
    volumes:
      - ./authentik/blueprints:/blueprints/custom:ro
    extra_hosts:
      # The worker runs the actual SCIM sync, so it also needs to reach :8000.
      - "host.docker.internal:host-gateway"
    depends_on:
      authentik-postgres:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 60s

  # Local AWS emulator. Gives the AWS-backed code paths a local target with no
  # cloud account: SQS (the `lambda` dispatch modes for extraction/ERP/audit),
  # SES (the `ses` email adapter), CloudWatch Logs + S3 Object Lock (the audit-log
  # shipper sinks). Opt-in under the `aws` profile (`pnpm aws:up`). The init
  # script under localstack/init/ready.d/ creates the queues, SES identity, log
  # group, and object-lock bucket on boot. Point the app at it by setting
  # AP_AWS_ENDPOINT_URL=http://localhost:4566 (see docs/local-aws-localstack.md).
  localstack:
    image: localstack/localstack:3
    profiles: ["aws"]
    environment:
      SERVICES: s3,sqs,ses,logs
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"available\"\\|\"sqs\": \"running\"'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Local AI model server for the `ollama` extraction adapter — runs invoice
  # extraction with no API key and no cloud. Opt-in under the `ai` profile
  # (`pnpm ollama:up`). Host port 11435 (not the native default 11434) so it
  # coexists with a natively-installed Ollama; select it with
  # AP_OLLAMA_BASE_URL=http://localhost:11435. Pull a model first, e.g.
  # `pnpm ollama:pull moondream` (small vision model). CPU by default; uncomment
  # the deploy block for NVIDIA GPU (needs nvidia-container-toolkit).
  # See backend/docs/local-ai-testing.md.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Stripe's official API mock for the stripe_treasury payment adapter — lets the
  # payment-run path run against a Stripe-shaped API offline (no sk_test_ key, no
  # network). Opt-in under the `payments` profile (`pnpm stripe:up`). Returns
  # canned fixtures generated from Stripe's OpenAPI spec (no persisted state), so
  # it validates request shape + response parsing, not stateful flows. Point the
  # adapter at it with AP_STRIPE_API_BASE=http://localhost:12111/v1.
  stripe-mock:
    image: stripe/stripe-mock:latest
    profiles: ["payments"]
    ports:
      - "12111:12111"

  # Fake ERP server for the real (non-mock) ERP adapters — emulates Merge.dev
  # unified accounting (/merge/api/accounting/v1), NetSuite SuiteTalk REST
  # (/netsuite/services/rest/record/v1), and Dynamics 365 Business Central OData
  # (/d365) in one deterministic in-memory process, so post_invoice / status
  # polling / PO + GL-account sync run end-to-end with no cloud account. Opt-in
  # under the `erp` profile (`pnpm erp:up`). Point the adapters at it via the
  # AP_ERP_MERGE_API_BASE / AP_ERP_NETSUITE_API_BASE / AP_ERP_D365_API_BASE /
  # AP_ERP_D365_TOKEN_URL overrides in backend/.env.development (host port
  # 12112). POST /__reset clears state between test runs. See tools/fake-erp/.
  fake-erp:
    build:
      context: ../tools/fake-erp
    profiles: ["erp"]
    ports:
      - "12112:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP sink + web inbox for outbound email. With AP_EMAIL_PROVIDER=smtp
  # the app's transactional mail (signup, welcome, scheduled reports) lands here
  # instead of the real internet — view rendered HTML at http://localhost:8025.
  # Opt-in under the `mail` profile (`pnpm mail:up`). Captures only; never relays.
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["mail"]
    ports:
      - "1025:1025"   # SMTP — AP_SMTP_PORT
      - "8025:8025"   # web UI + API

volumes:
  pgdata:
  miniodata:
  authentik-pgdata:
  localstack-data:
  ollama-data:
