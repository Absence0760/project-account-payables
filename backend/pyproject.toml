[project]
name = "backend"
version = "0.1.0"
description = "Accounts Payables API — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.15,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "python-multipart>=0.0.20,<1",
    "boto3>=1.37,<2",
    "passlib[bcrypt]>=1.7,<2",
    "bcrypt>=4.0,<4.1",
    "redis>=5.0,<6",
    "python-jose[cryptography]>=3.3,<4",
    "httpx>=0.28,<1",
    "PyMuPDF>=1.24,<2",
    "pgvector>=0.3,<1",
    "authlib>=1.3,<2",
    "pyotp>=2.9,<3",
    "qrcode[pil]>=7.4,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.25,<1",
    "httpx>=0.28,<1",
    "ruff>=0.11,<1",
]
# Optional: auto-rotation of scanned invoice pages via Tesseract OSD.
# Install with `pip install -e ".[ocr]"` and ensure the `tesseract` binary
# (plus the `osd` traineddata file) is on PATH. Missing → auto-rotate
# degrades to a silent no-op in `services.image_preprocess`.
ocr = [
    "pytesseract>=0.3.13,<1",
    "Pillow>=10,<12",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
