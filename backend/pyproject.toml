[project]
name = "backend"
version = "0.1.0"
description = "Accounts Payables API — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0,<1",
    # Pinned explicitly (transitive via fastapi) to hold the floor above
    # CVE-2026-54283 / CVE-2026-54282: request.form() limits silently ignored
    # for application/x-www-form-urlencoded (DoS), both fixed in 1.3.1.
    "starlette>=1.3.1,<2",
    "uvicorn[standard]>=0.51.0,<1",
    "sqlalchemy[asyncio]>=2.0.51,<3",
    "asyncpg>=0.31.0,<1",
    "alembic>=1.18.5,<2",
    "pydantic>=2.13.4,<3",
    # >=2.14.2 fixes GHSA-4xgf-cpjx-pc3j (NestedSecretsSettingsSource follows
    # symlinks outside secrets_dir).
    "pydantic-settings>=2.14.2,<3",
    "python-multipart>=0.0.32,<1",
    "boto3>=1.43.46,<2",
    "passlib[bcrypt]>=1.7.4,<2",
    # bcrypt held at 4.x: passlib 1.7.4 reads `bcrypt.__about__.__version__`
    # which was removed in bcrypt 5.0, and 5.0's strict >72-byte handling
    # collides with passlib's bcrypt-detection probe. Lift only when passlib
    # ships a fix or the codebase migrates off passlib for bcrypt_sha256.
    "bcrypt>=4.0,<4.1",
    "redis>=8.0.1,<9",
    "python-jose[cryptography]>=3.5.0,<4",
    "httpx>=0.28.1,<1",
    "PyMuPDF>=1.28.0,<2",
    "pgvector>=0.5.0,<1",
    # OIDC ID-token signature + claims verification in services/sso.py.
    # (Successor to authlib.jose, which deprecated that module in favour of
    # joserfc; we use joserfc directly so there's no authlib dependency.)
    "joserfc>=1.7.3,<2",
    # SAML 2.0 Service-Provider: assertion XML-DSig verification (services/
    # auth_saml.py). python3-saml verifies in-process via python-xmlsec (no
    # xmlsec1 binary shell-out), keeping the slim-image / local-first story
    # intact. xmlsec + lxml are transitive but pinned explicitly so they land
    # in the hash-locks; both ship cp314 binary wheels (no -devel headers
    # needed). Floor >=1.16 carries the modern xmlsec node-binding XSW fixes.
    "python3-saml>=1.16,<2",
    "xmlsec>=1.3.17,<2",
    "lxml>=6.1.1,<7",
    "pyotp>=2.10.0,<3",
    "qrcode[pil]>=8.2,<9",
    # WebAuthn / passkeys — the second MFA factor alongside pyotp's TOTP.
    # Wraps the FIDO2 register/authenticate ceremonies (services/webauthn.py).
    "webauthn>=3.0.0,<4",
    "reportlab>=5.0.0,<6",
    # Loaded by the local-dev entrypoint (main.py) to read .env.development /
    # .env. Already pulled in transitively by uvicorn[standard]; declared here
    # because main.py imports it directly. Never imported on Lambda/prod paths.
    "python-dotenv>=1.2.2,<2",
    # AWS Lambda Runtime Interface Client. The single container image is
    # dual-use: ECS runs it via the uvicorn CMD, and the async-worker Lambdas
    # (services/{extraction,erp,audit}_lambda.py) run the SAME image as a
    # container Lambda — each function's ImageConfig overrides the entrypoint
    # to `python -m awslambdaric` + its handler. Bundling the RIC here is what
    # lets aws-deploy.yml's `lambdas` job point every worker at the one image
    # the backend job built (one build, many runtimes). Ships a cp314
    # manylinux wheel, so no compiler is added to the slim image. The RIC is
    # imported only by the Lambda runtime, never on the ECS/API path. See
    # docs/production-deployment.md → Lambda workers.
    "awslambdaric>=4.0.1,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    # CI shards the backend suite across parallel jobs (ci.yml → backend-test
    # matrix). pytest-split's `--splits N --group G` partitions the suite by
    # the committed `.test_durations` baseline so each shard gets a roughly
    # equal wall-clock slice. Regenerate the baseline with
    # `pytest --store-durations` after large test-surface changes.
    "pytest-split>=0.11.0,<1",
    "httpx>=0.28.1,<1",
    # Tight pin: ruff occasionally adds new lint rules in patch
    # releases (0.15 added the I001 check that bit us once). Pinning
    # to a single minor keeps CI's `pip install` from quietly picking
    # up stricter rules than the local venv runs. Bump intentionally
    # via dependabot or a manual upgrade pass.
    "ruff>=0.15.22,<0.16",
]
# Optional: auto-rotation of scanned invoice pages via Tesseract OSD.
# Install with `pip install -e ".[ocr]"` and ensure the `tesseract` binary
# (plus the `osd` traineddata file) is on PATH. Missing → auto-rotate
# degrades to a silent no-op in `services.image_preprocess`.
ocr = [
    "pytesseract>=0.3.13,<1",
    "Pillow>=12.3.0,<13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    # passlib (1.7.4) still imports the deprecated stdlib `crypt` module
    # on every import. We pin passlib via deps; nothing we can do until
    # upstream releases a fix (tracked at https://foss.heptapod.net/python-libs/passlib/-/issues/188).
    "ignore:'crypt' is deprecated:DeprecationWarning",
]
