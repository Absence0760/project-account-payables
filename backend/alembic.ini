[alembic]
script_location = alembic
# Put THIS ini file's directory (backend/) on sys.path, so `alembic/env.py`'s
# `from app.config import settings` resolves against the checkout this ini
# belongs to. Without it `app` is not on sys.path at all — the `alembic`
# console script's sys.path[0] is the venv's bin/ — and a worktree reusing the
# primary checkout's venv falls through to the editable install's baked-in
# `__editable___backend_0_1_0_finder`, which maps `app` to whichever checkout
# `pip install -e` was run in. `alembic revision --autogenerate` would then
# diff against the WRONG models and emit a plausible, wrong migration.
#
# `%(here)s`, not the `.` alembic's own template suggests: the value is spliced
# onto sys.path verbatim (`sys.path[:0] = [...]` in alembic/script/base.py), so
# `.` is relative to the process CWD, not to this file. From the repo root it
# would add the repo root — no `app/` there, and the fall-through is back.
prepend_sys_path = %(here)s
# Required alongside it, not cosmetic: with no path_separator alembic falls
# back to splitting the value on spaces, commas AND colons, so a checkout under
# a path containing a space would silently become two bogus sys.path entries —
# and the fall-through above is what fills the gap. `os` splits on os.pathsep.
path_separator = os
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/feohledger

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
