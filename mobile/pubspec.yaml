name: ap_mobile
description: Accounts Payable mobile app — invoice approval, payment tracking, dashboard.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.11.1
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  local_auth: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pull_to_refresh_flutter3: ^2.0.2
  sqflite: ^2.4.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
