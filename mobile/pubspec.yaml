publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  cached_network_image: ^3.4.1
  camera: ^0.12.0+1
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.2
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^21.0.0
  flutter_secure_storage: ^10.0.0
  http: ^1.3.0
  http_parser: ^4.1.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  local_auth: ^3.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdfx: ^2.9.2
  pull_to_refresh_flutter3: ^2.0.2
  sqflite: ^2.4.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
