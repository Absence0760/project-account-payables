# sops-encrypted file routing.
#
# Each per-env `secrets.enc.yaml` is encrypted with that env's KMS key.
# The KMS key is created by `modules/sops-kms` on `terraform apply`
# for the env (see infra/envs/<env>/main.tf).
#
# First-time setup for an env (after `terraform apply` has created
# the KMS key): run `bin/sops-init.sh [preview|prod]`. The script
# is idempotent. The manual equivalent:
#
#   ARN=$(cd infra/envs/prod && terraform output -raw kms_key_arn)
#   sed -i "s|REPLACE_PROD_KMS_ARN|$ARN|" infra/.sops.yaml
#   echo "DATABASE_URL: replace-me" > /tmp/secrets.yaml
#   sops --encrypt /tmp/secrets.yaml > infra/envs/prod/secrets.enc.yaml
#
# Rotation: edit the file in place with `sops infra/envs/prod/secrets.enc.yaml`,
# save, then `terraform apply` to push new values to the runtime.
#
# The two creation_rules below are placeholders — fill the ARNs in via
# bin/sops-init.sh. The rules don't affect *decryption* — that uses
# whatever KMS key the file was encrypted with — only what `sops`
# defaults to when you run `sops --encrypt` on a fresh file.

creation_rules:
  - path_regex: envs/prod/secrets\.enc\.yaml$
    kms: REPLACE_PROD_KMS_ARN
  - path_regex: envs/preview/secrets\.enc\.yaml$
    kms: REPLACE_PREVIEW_KMS_ARN
