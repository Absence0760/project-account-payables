# Gitleaks configuration for FeohLedger.
#
# Inherits every rule from the upstream default config and layers a
# project-specific allowlist on top. The allowlist below covers test
# fixtures (synthetic passwords, fake API keys for auth/security
# tests) and documentation examples (JSON request/response samples in
# `docs/` that contain person-shaped names + role lists). Each rule
# is narrow enough that a real key with the same shape would still
# trip the scanner.
#
# Audit the additions with:
#   gitleaks detect --config=.gitleaks.toml --no-banner --redact
#
# If a future scan flags a new test fixture, add it here rather than
# weakening one of the upstream rules — the existing rules catch
# real keys (AWS/GCP/JWT/etc.) and we don't want to lose that coverage.

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Global allowlist — applies to every rule, including the upstream defaults.
#
# MUST be the singular [allowlist] table, NOT the plural [[allowlists]]
# array-of-tables. Under `[extend] useDefault = true`, gitleaks (verified on
# 8.24.3 — the version gitleaks-action@v3.0.0 runs in CI) silently IGNORES a
# top-level [[allowlists]] block, so every path/regex below would be inert and
# synthetic high-entropy fixtures (e.g. the idempotency-key UUIDs) would trip
# generic-api-key. The singular form is honoured. Don't "modernize" it to the
# plural spelling.
# ---------------------------------------------------------------------------
[allowlist]
description = "Global skip list for test fixtures and doc examples"
# Path patterns where every match is permissible. These files contain
# synthetic credentials by definition (security tests, complexity
# fixtures, RBAC examples).
paths = [
    '''(?i)^.*test_password_security\.py$''',
    '''(?i)^.*test_auth_error_consistency\.py$''',
    '''(?i)^.*test_auth_token_security\.py$''',
    '''(?i)^.*test_login_security\.py$''',
    '''(?i)^.*tests-e2e/auth/password-security\.spec\.ts$''',
    '''(?i)^.*tests-e2e/auth/login-security\.spec\.ts$''',
    '''(?i)^.*tests-e2e/auth/token-tampering\.spec\.ts$''',
    '''(?i)^docs/user-management\.md$''',
    '''(?i)^docs/authentication\.md$''',
    '''(?i)^backend/docs/api-reference\.md$''',
]
# Synthetic-credential regexes that may legitimately appear anywhere
# in the codebase (fixtures + docs samples).
regexes = [
    # Documentation example passwords used in onboarding / API reference docs.
    '''demo-password''',
    '''change-me-in-production''',
    # Common test-password literal patterns. These are deliberately
    # high-entropy enough to satisfy the password-complexity validator
    # but obvious enough not to be confused with real secrets.
    '''StrongPass\d+[A-Z]?''',
    '''Secret-Sauce-[A-Za-z0-9-]+''',
    '''Portal-Secret-\d+''',
    '''Right-Password-\d+''',
    '''Test-?Password-?\d*''',
    # Synthetic idempotency-key UUIDs in test_card_create_idempotency_header.py
    # (opaque request tokens, not credentials). Allowlisted as exact literals
    # so a real UUID-shaped secret elsewhere still trips the scanner.
    '''2f8c1f3e-4a6b-4c2d-9e1f-7b3a5c9d0e11''',
    '''9a1d0c77-1111-4222-8333-444455556666''',
    # FEOH_TEAMS_SECURITY_TOKEN's committed local-dev value in
    # backend/.env.development. It is base64 of the literal string
    # "dev-teams-security-token" — Teams verifies its HMAC with the
    # base64-DECODED token, so unlike every sibling dev value (plain
    # `dev-*` text) this one has to be base64, and that encoding is what
    # pushes it over generic-api-key's entropy threshold. Allowlisted as an
    # exact literal, so a real Teams token in this variable still trips.
    '''ZGV2LXRlYW1zLXNlY3VyaXR5LXRva2Vu''',
]

# Historical findings the regexes above don't cleanly cover (a specific
# commit's exact patch, rather than a reusable literal pattern) are
# allowlisted by fingerprint in the repo-root `.gitleaksignore` file, not
# here — gitleaks' TOML schema has no config-level `fingerprints` field;
# that's a `.gitleaksignore`-only mechanism (see that file's header).
