version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # `patterns` is not optional in practice. This group declared only
      # `update-types` and did not group: #334, #335, #337, #339, #346 and
      # #347 each arrived on their own `dependabot/pip/backend/<dep>-gte-…`
      # branch, while the npm group beside it (same shape) grouped fine. The
      # two groups in this file that demonstrably DO group (`actions`,
      # `fake-erp`) both specify `patterns`, so a group with no member matcher
      # appears to match nothing. Because the backend locks are regenerated by
      # hand, one ungrouped bump costs a whole recompile — the multiplier is
      # the real cost, not the PR count.
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Both Dockerfiles pin their base image by digest so Scorecard's
  # PinnedDependencies check passes and a re-tagged python:3.14-slim can't
  # change what we build. A digest pin only stays safe if something bumps
  # it — without this entry the fixture image would silently rot on an
  # ever-older, ever-more-CVE-laden base.
  - package-ecosystem: docker
    directory: /tools/fake-erp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # fake-erp's Python deps. Dependabot's pip-compile support pairs
  # requirements.in with requirements.txt (it only treats a file as a
  # pip-compile lockfile when the name ends in `.txt` and matches the
  # `.in` basename) and re-applies --generate-hashes because the output
  # already carries --hash= lines. Grouped because a fixture doesn't
  # warrant one PR per transitive bump.
  - package-ecosystem: pip
    directory: /tools/fake-erp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      fake-erp:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      terraform-minor-patch:
        update-types:
          - minor
          - patch
