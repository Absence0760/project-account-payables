version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # `patterns` was NOT the operative difference — that hypothesis is
      # refuted. It was added on 2026-09-05; the next scheduled run
      # (Monday 2026-09-07) still delivered #379 and #381 on their own
      # `dependabot/pip/backend/<dep>-gte-…` branches, and the npm group
      # below groups fine with no `patterns` at all.
      #
      # What actually differs is `update-types` on an ecosystem where
      # Dependabot can see no lockfile. Our locks are `requirements.lock` /
      # `requirements-dev.lock`, and pip-compile support only recognises a
      # lockfile whose name ends in `.txt` and matches an `.in` basename
      # (see the fake-erp note below, which is why THAT group works). So for
      # /backend Dependabot reads only pyproject's ranges, resolves no
      # concrete version, computes no semver update type, and every member
      # falls out of a group filtered by one. The branch names say so:
      # `boto3-gte-1.43.88-and-lt-2` is a requirement-range edit, not a
      # version bump.
      #
      # So the group is now shaped exactly like the two that demonstrably do
      # group (`actions`, `fake-erp`): `patterns` alone, no `update-types`.
      # The cost is that a major can now ride in the same PR as patches;
      # that is the lesser evil while every bump arrives alone, because the
      # backend locks are regenerated by hand and one ungrouped bump costs a
      # whole recompile.
      #
      # Confirmed if the next Monday run delivers the pip bumps on one
      # `dependabot/pip/backend/backend-minor-patch-…` branch; refuted if
      # they again arrive separately — in which case the remaining lead is
      # renaming the locks to the `.in`/`.txt` pair pip-compile support
      # recognises.
      backend-minor-patch:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # Both Dockerfiles pin their base image by digest so Scorecard's
  # PinnedDependencies check passes and a re-tagged python:3.14-slim can't
  # change what we build. A digest pin only stays safe if something bumps
  # it — without this entry the fixture image would silently rot on an
  # ever-older, ever-more-CVE-laden base.
  - package-ecosystem: docker
    directory: /tools/fake-erp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # fake-erp's Python deps. Dependabot's pip-compile support pairs
  # requirements.in with requirements.txt (it only treats a file as a
  # pip-compile lockfile when the name ends in `.txt` and matches the
  # `.in` basename) and re-applies --generate-hashes because the output
  # already carries --hash= lines. Grouped because a fixture doesn't
  # warrant one PR per transitive bump.
  - package-ecosystem: pip
    directory: /tools/fake-erp
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      fake-erp:
        patterns:
          - "*"

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      terraform-minor-patch:
        update-types:
          - minor
          - patch
