name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt every JS-based action into Node 24 ahead of GitHub's 2026-06-02
# forced upgrade. Without this, the runner emits a deprecation warning
# per action invocation because each one's action.yml still declares
# runs.using: node20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel in-flight CI runs on the same ref when a new push lands.
# Saves runner minutes on rapid-fire pushes; main-branch runs are
# preserved (cancel only on non-main refs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Minimum GITHUB_TOKEN surface: every job in this workflow just reads
# the working tree. Anything that needs to upload artifacts elevates
# at the job level (none currently do — upload-artifact uses the same
# `contents: read` scope plus its own ephemeral artifact storage).
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector image — Postgres 16 with the `vector`
        # extension preinstalled. Required because `seed.py` runs
        # `CREATE EXTENSION vector` for invoice_embeddings (RAG).
        # Stock postgres:16 doesn't ship the extension; CI without
        # this fails with "extension 'vector' is not available".
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: account_payables
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.1.0
        with:
          # Match backend/Dockerfile — runtime parity catches bugs
          # that only manifest on 3.14 (e.g. removed deprecated APIs).
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Pin pip
        # Scorecard PinnedDependenciesID treats every `pip install`
        # invocation as a supply-chain pivot point. Pinning pip itself
        # to a specific version makes the install reproducible across
        # runner image refreshes — the rest of the dep tree is locked
        # via pyproject.toml's upper bounds + the cached pip-resolver
        # state.
        run: python -m pip install --upgrade 'pip==26.1.1'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Run tests
        env:
          AP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/account_payables
          AP_REDIS_URL: redis://localhost:6379
          AP_SECRET_KEY: ci-test-secret
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        env:
          PUBLIC_API_URL: http://localhost:8000
        run: pnpm check

      - name: Build
        env:
          PUBLIC_API_URL: http://localhost:8000
        run: pnpm build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.1
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  shellcheck:
    name: ShellCheck (bin/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck bin/*.sh

  e2e:
    # Shard the Playwright suite across 4 parallel GitHub runners. Each
    # shard boots its own Postgres + Redis + seeded backend, so there's
    # zero cross-shard DB state risk. Within a shard, Playwright runs
    # `workers=4` (matching the four `e2e<N>` tenants the seed provisions
    # in *that* shard's DB) — total parallelism is therefore 4 shards ×
    # 4 workers = 16 concurrent test processes spread across 4 machines.
    # Cuts a previously-single-job e2e run down by roughly a factor of
    # the slowest shard's wall clock.
    name: Frontend e2e (Playwright) — shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One shard failing shouldn't cancel the others — we want to see
      # whether the failure is shard-specific (i.e. a single flaky spec)
      # or systemic (every shard fails the same way).
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        # pgvector/pgvector image — Postgres 16 with the `vector`
        # extension preinstalled. Required because `seed.py` runs
        # `CREATE EXTENSION vector` for invoice_embeddings (RAG).
        # Stock postgres:16 doesn't ship the extension; CI without
        # this fails with "extension 'vector' is not available".
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: account_payables
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      AP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/account_payables
      AP_REDIS_URL: redis://localhost:6379
      AP_SECRET_KEY: ci-test-secret
      AP_DEBUG: "true"
      AP_PUBLIC_URL: http://localhost:7777
      AP_TENANT_URL_TEMPLATE: "http://{slug}.localhost:7777"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Backend
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.1.0
        with:
          # Match backend/Dockerfile (3.14-slim).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Pin pip
        # See Scorecard PinnedDependenciesID note on the Backend job
        # for why pip itself is pinned before any install runs.
        run: python -m pip install --upgrade 'pip==26.1.1'

      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Seed database (lean: acme + techflow + e2e1..e2e4)
        working-directory: backend
        # Each matrix shard runs against its own Postgres service, so
        # the seeded tenants only have to be unique within the shard —
        # no need to namespace by `matrix.shard` here.
        #
        # `--lean` swaps every tenant onto the minimal fixture path
        # in `seed.py::seed_tenant_lean` — 4 vendors + 10 invoices +
        # 1 workflow + 1 GL per tenant, vs the full demo dataset's
        # ~9 vendors / ~50 invoices / payment runs / exceptions /
        # PO matching / virtual cards. The full set is for local
        # dev (you actually want to click around); the e2e suite
        # builds whatever extra state it needs on the fly.
        run: python scripts/seed.py --lean

      - name: Start backend in background
        working-directory: backend
        run: |
          nohup python main.py > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "backend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not respond on /api/health within 30s"
          tail -100 /tmp/backend.log || true
          exit 1

      # Frontend + Playwright
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.2
        with:
          version: 9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright suite (shard ${{ matrix.shard }}/4)
        working-directory: frontend
        env:
          PUBLIC_API_URL: http://localhost:8000
        # Inline the Playwright invocation rather than calling
        # `pnpm test:e2e` so the `--shard=N/4` flag flows through.
        # Workers stay at the playwright.config.ts default (4), so
        # each shard exercises every `e2e<N>` tenant it seeded.
        run: pnpm exec playwright test --config=tests-e2e/playwright.config.ts --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          # Suffix with shard so the 4 parallel jobs don't collide on
          # the upload-artifact name — `upload-artifact` rejects
          # duplicate names across a workflow.
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: backend-log-shard-${{ matrix.shard }}
          path: /tmp/backend.log
          retention-days: 7
