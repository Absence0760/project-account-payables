name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt every JS-based action into Node 24 ahead of GitHub's 2026-06-02
# forced upgrade. Without this, the runner emits a deprecation warning
# per action invocation because each one's action.yml still declares
# runs.using: node20.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel in-flight CI runs on the same ref when a new push lands.
# Saves runner minutes on rapid-fire pushes; main-branch runs are
# preserved (cancel only on non-main refs).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Minimum GITHUB_TOKEN surface: every job in this workflow just reads
# the working tree. Anything that needs to upload artifacts elevates
# at the job level (none currently do — upload-artifact uses the same
# `contents: read` scope plus its own ephemeral artifact storage).
permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector image — Postgres 16 with the `vector`
        # extension preinstalled. Required because `seed.py` runs
        # `CREATE EXTENSION vector` for invoice_embeddings (RAG).
        # Stock postgres:16 doesn't ship the extension; CI without
        # this fails with "extension 'vector' is not available".
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: account_payables
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.1.0
        with:
          # Match backend/Dockerfile — runtime parity catches bugs
          # that only manifest on 3.14 (e.g. removed deprecated APIs).
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Pin pip
        # Scorecard PinnedDependenciesID treats every `pip install`
        # invocation as a supply-chain pivot point. Pinning pip itself
        # to a specific version makes the install reproducible across
        # runner image refreshes — the rest of the dep tree is locked
        # via pyproject.toml's upper bounds + the cached pip-resolver
        # state.
        run: python -m pip install --upgrade 'pip==26.1.1'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Run tests
        env:
          AP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/account_payables
          AP_REDIS_URL: redis://localhost:6379
          AP_SECRET_KEY: ci-test-secret
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.2
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        env:
          PUBLIC_API_URL: http://localhost:8000
        run: pnpm check

      - name: Build
        env:
          PUBLIC_API_URL: http://localhost:8000
        run: pnpm build

  mobile:
    name: Mobile
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.21.1
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  shellcheck:
    name: ShellCheck (bin/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck bin/*.sh

  e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # pgvector/pgvector image — Postgres 16 with the `vector`
        # extension preinstalled. Required because `seed.py` runs
        # `CREATE EXTENSION vector` for invoice_embeddings (RAG).
        # Stock postgres:16 doesn't ship the extension; CI without
        # this fails with "extension 'vector' is not available".
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: account_payables
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      AP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/account_payables
      AP_REDIS_URL: redis://localhost:6379
      AP_SECRET_KEY: ci-test-secret
      AP_DEBUG: "true"
      AP_PUBLIC_URL: http://localhost:7777
      AP_TENANT_URL_TEMPLATE: "http://{slug}.localhost:7777"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Backend
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.1.0
        with:
          # Match backend/Dockerfile (3.14-slim).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Pin pip
        # See Scorecard PinnedDependenciesID note on the Backend job
        # for why pip itself is pinned before any install runs.
        run: python -m pip install --upgrade 'pip==26.1.1'

      - name: Install backend deps
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Seed database (creates `acme` tenant + demo users)
        working-directory: backend
        run: python scripts/seed.py

      - name: Start backend in background
        working-directory: backend
        run: |
          nohup python main.py > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "backend up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not respond on /api/health within 30s"
          tail -100 /tmp/backend.log || true
          exit 1

      # Frontend + Playwright
      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6.0.2
        with:
          version: 9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: frontend
        env:
          PUBLIC_API_URL: http://localhost:8000
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: backend-log
          path: /tmp/backend.log
          retention-days: 7
