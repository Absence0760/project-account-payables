# Dedicated SSO end-to-end workflow.
#
# SSO is also exercised by the broader `service-e2e` job in `ci.yml` (bundled
# with email / LocalStack / stripe-mock). This workflow is the focused,
# fast-feedback counterpart: it boots ONLY Keycloak, seeds SSO on the acme
# tenant, and drives the real OIDC handshake through the browser
# (`frontend/tests-e2e/sso/`). It gives a single, isolated green/red signal for
# "can a user sign in via SSO" without waiting on the 25-minute four-service
# bundle.
#
# Triggers: push / PR to main that touch the SSO surface (backend SSO routes +
# service, the Keycloak realm + seed script, the login routes, the SSO specs),
# plus manual dispatch. No schedule by design — SSO is re-verified when the
# code or IdP config that affects it changes.
name: SSO e2e

on:
  push:
    branches: [main]
    paths: &sso-paths
      - "backend/app/api/auth_sso.py"
      - "backend/app/services/sso.py"
      - "backend/keycloak/realm-export.json"
      - "backend/scripts/enable_keycloak_sso.py"
      - "backend/docker-compose.yml"
      - "frontend/src/routes/login/**"
      - "frontend/tests-e2e/sso/**"
      - "frontend/tests-e2e/fixtures/**"
      - ".github/workflows/sso-e2e.yml"
  pull_request:
    branches: [main]
    paths: *sso-paths
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: sso-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sso-e2e:
    name: SSO e2e (Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: account_payables
          PGDATA: /dev/shm/pgdata
        ports:
          - 5432:5432
        options: >-
          --shm-size=2g
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      AP_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/account_payables
      AP_REDIS_URL: redis://localhost:6379
      AP_SECRET_KEY: ci-test-secret
      AP_DEBUG: "true"
      AP_PUBLIC_URL: http://localhost:7777
      AP_TENANT_URL_TEMPLATE: "http://{slug}.localhost:7777"
      AP_RATE_LIMIT_ENABLED: "false"
      AP_MAX_CONCURRENT_SESSIONS: "100"
      AP_E2E_TENANT_COUNT: "1"
      AP_E2E_USE_PREVIEW: "true"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.2
        with:
          version: 9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Pin pip
        run: python -m pip install --upgrade 'pip==26.1.1'

      - name: Install backend + frontend deps (parallel)
        run: |
          set -euo pipefail
          (cd backend && pip install -e ".[dev]") &
          PIP_PID=$!
          (cd frontend && pnpm install --frozen-lockfile) &
          PNPM_PID=$!
          wait $PIP_PID || { echo "::error::backend pip install failed"; exit 1; }
          wait $PNPM_PID || { echo "::error::frontend pnpm install failed"; exit 1; }

      - name: Start Keycloak
        working-directory: backend
        # Only Keycloak from the `idp` profile — not Authentik (SCIM, not needed
        # here) and not the compose core Postgres/Redis, which would collide with
        # the GitHub `services:` above.
        run: docker compose --profile idp up -d keycloak

      - name: Wait for Keycloak
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            curl -fsS "http://localhost:8088/realms/account-payables/.well-known/openid-configuration" >/dev/null 2>&1 \
              && { echo "keycloak up"; exit 0; }
            sleep 2
          done
          echo "::error::keycloak not ready"; exit 1

      - name: Seed database (lean)
        working-directory: backend
        run: python scripts/seed.py --lean

      - name: Enable Keycloak SSO on the acme tenant
        working-directory: backend
        run: python scripts/enable_keycloak_sso.py

      - name: Start backend in background
        working-directory: backend
        run: |
          nohup python main.py > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not respond on /api/health within 30s"
          tail -100 /tmp/backend.log || true
          exit 1

      - name: Build frontend
        working-directory: frontend
        env:
          PUBLIC_API_URL: http://localhost:8000
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run SSO e2e specs
        working-directory: frontend
        env:
          PUBLIC_API_URL: http://localhost:8000
          PLAYWRIGHT_WORKERS: "1"
        run: pnpm exec playwright test --config=tests-e2e/playwright.config.ts sso/

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: playwright-report-sso-e2e
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Upload backend + Keycloak logs on failure
        if: failure()
        run: |
          echo "===== backend.log =====" && tail -200 /tmp/backend.log || true
          cd backend && docker compose logs keycloak || true
