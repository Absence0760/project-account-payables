name: Dependabot auto-merge

# Automatically squash-merges minor + patch Dependabot PRs once CI is
# green. Saves review burden — `.github/dependabot.yml` configures
# four ecosystems (github-actions, pip, npm, docker), each opening
# 3–5 PRs / week, so without this most of the human review time goes
# to bumping a patch version of an action or a transitive lodash dep.
#
# Major bumps stay manual. The last manual sweep through this repo
# proved why: bcrypt 4 → 5 silently broke passlib 1.7.4 (passlib reads
# `bcrypt.__about__.__version__`, removed in 5.0) and every login
# failed out of `_calc_checksum`. Auto-merging that would have shipped
# the regression to main.
#
# Repository setting required: "Allow auto-merge" enabled on
# Settings → General → Pull Requests. Without it `gh pr merge --auto`
# returns an error and the workflow no-ops; PRs sit waiting for a
# human like before, so worst case is degenerate, not destructive.

on:
  pull_request_target:
    branches: [main]

permissions:
  # `pull_request_target` runs in the base-branch context — needs
  # explicit grants for the few things gh/dependabot do here.
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge minor + patch
    runs-on: ubuntu-latest
    # Pull-request author check guards against any non-dependabot
    # PR accidentally tripping this. The fetch-metadata action below
    # is hardened against forged commit messages from compromised
    # branches, but a belt-and-braces author gate costs nothing.
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 5
    steps:
      - name: Read dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          # Fetch metadata signs the result with the workflow's own
          # GITHUB_TOKEN so a malicious PR can't claim to be a patch
          # bump it isn't.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The bot self-approval is a courtesy for repos that gate merge on a
      # review — it is NOT load-bearing here (main is unprotected). The
      # GITHUB_TOKEN also cannot approve unless the org enables "Allow GitHub
      # Actions to create and approve pull requests" (off by default). Keep it
      # in its own continue-on-error step so a disabled setting can't abort the
      # merge: previously both commands shared one `bash -e` step, so the
      # blocked `gh pr review --approve` exited 1 and the merge below never ran.
      - name: Approve (best-effort)
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"

      - name: Enable auto-merge (squash)
        if: steps.meta.outputs.update-type == 'version-update:semver-minor' || steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # `--auto --squash` lands the merge as soon as every required check
        # turns green (needs the repo "Allow auto-merge" setting, now enabled).
        # With no required checks configured, GitHub merges as soon as the PR
        # is mergeable.
        run: gh pr merge --auto --squash "$PR_URL"
