name: Terraform

# Guards the `infra/` stack against three classes of regression:
#   1. `terraform fmt` drift — keeps the formatter idempotent so the
#      PR diff is the real change, not whitespace churn.
#   2. `terraform validate` — syntax + provider-version + ref-shape
#      checks. Doesn't touch state (we pass `-backend=false`), so the
#      check can run without AWS credentials.
#   3. Trivy IaC mode — known-bad patterns (public S3 buckets, IAM
#      `Action: *`, security-group 0.0.0.0/0 ingress, etc.). Cheaper
#      to surface in CI than discover after `terraform apply`. Trivy
#      is reused from the security workflow so we don't introduce a
#      second IaC scanner; the same SARIF flows to the Security tab.
#
# Runs on every PR that touches `infra/` and on every push to main.
# Doesn't run on docs-only edits — the path filter below scopes it.
#
# The stack today is a single flat module at `infra/` (KMS key + S3
# buckets for invoices + audit-log Object Lock + variables). When the
# rest of `docs/production-deployment.md` lands (ECS, ALB, CloudFront,
# RDS), break those into per-env stacks (`infra/envs/{dev,staging,prod}`)
# and convert the single-step below into a matrix.

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  fmt-validate:
    name: fmt + validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # The version this stack is validated against (satisfies the
          # `>= 1.6` floor in `infra/main.tf`). terraform_wrapper=false
          # so the raw exit codes propagate to the job status.
          terraform_version: '1.15.0'
          terraform_wrapper: false

      - name: terraform fmt -check
        working-directory: infra
        run: terraform fmt -check -diff

      - name: backend override for validate
        working-directory: infra
        # Terraform 1.15+ `validate` checks the backend block's required
        # arguments, so the empty partial-config `backend "s3" {}` fails
        # without state access. Overriding to the `local` backend for this
        # job keeps validate credential-free. The file is gitignored —
        # committing it would switch real applies to local state.
        run: printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf

      - name: terraform init (backend=false)
        working-directory: infra
        # `-backend=false` skips the S3 state lookup — `validate`
        # doesn't need it, and we don't want to give CI write access
        # to the prod state bucket just to run a syntax check.
        run: terraform init -backend=false -input=false

      - name: terraform validate
        working-directory: infra
        run: terraform validate -no-color

  trivy-iac:
    name: Trivy IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # `scan-type: config` runs the IaC ruleset across HCL / yaml
          # / json (so it picks up the workflows too, harmlessly).
          # Trivy bundles tfsec-derived checks so we get the same
          # coverage without standing up tfsec separately.
          scan-type: config
          scan-ref: infra
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload Trivy IaC SARIF
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        if: always()
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
