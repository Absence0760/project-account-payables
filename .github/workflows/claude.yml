name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Opt every JS-based action into Node 24 ahead of GitHub's 2026-06-02
# forced upgrade. Without this, the runner emits a deprecation warning
# per action invocation because each one's action.yml still declares
# `runs.using: node20`.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  claude:
    # Restrict who can summon Claude on the repo. Set the
    # CLAUDE_ALLOWED_USERS variable in repo settings → Variables, comma-
    # separated GitHub usernames. Without it, the gate is closed.
    if: |
      contains(vars.CLAUDE_ALLOWED_USERS, github.actor) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.assignees.*.login, 'claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--max-turns 40 --allowedTools 'Bash(npm *),Bash(pnpm *),Bash(git *),Bash(gh *),Read,Write,Edit,Glob,Grep'"
